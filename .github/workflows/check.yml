name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      # Pinned by commit SHA (v4.2.2), not by tag: a tag can be moved.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2

      - name: Drift check
        run: scripts/check-drift.sh

      - name: Gateway tests
        working-directory: gateway
        run: npm test

      - name: Content linter tests
        run: python3 -I plugins/arkad-content/skills/post-review/scripts/test_lint_post.py
